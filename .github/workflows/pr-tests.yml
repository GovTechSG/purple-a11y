name: PR Tests

# Runs on every pull request. Each test type is a separate job with no
# `needs:` dependency between them, so GitHub Actions schedules and runs
# them in parallel instead of sequentially.
#
# NOTE: the `lint` job (npm run lint) was removed because it currently
# fails on CI independent of any code changes: eslint 9.39.5's flat-config
# loader imports `minimatch` as an ESM default export
# (`@eslint/eslintrc/lib/config-array/override-tester.js`), but the
# installed `minimatch` version only provides named exports, so every run
# crashes with `SyntaxError: The requested module 'minimatch' does not
# provide an export named 'default'` before linting even starts. Re-add
# this job once the eslint/minimatch version mismatch is fixed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      OOBEE_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      OOBEE_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e
